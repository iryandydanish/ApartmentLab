services:
  portfoliowebsite:
    image: nginx:${NGINX_TAG}
    restart: unless-stopped
    networks:
      - edge
    expose:
      - "80"
    volumes:
      - ../portfoliowebsite/src:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10s

  portfoliowebsite_pub:
    image: alpine/socat
    restart: unless-stopped
    profiles: ["preprod"]
    networks:
      - edge
    ports:
      - "8081:8081"
    command: tcp-listen:8081,fork,reuseaddr tcp-connect:portfoliowebsite:80
    depends_on:
      - portfoliowebsite

networks:
  edge:
    external: true