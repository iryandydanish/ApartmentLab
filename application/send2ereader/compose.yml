services:
  send2ereader:
    image: lscr.io/linuxserver/calibre:${SEND2EREADER_TAG}
    restart: unless-stopped
    networks:
      - edge
    expose:
      - "8181"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8181/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10s

  send2ereader_pub:
    image: alpine/socat
    restart: unless-stopped
    profiles: ["preprod"]
    networks:
      - edge
    ports:
      - "3003:3003"
    command: tcp-listen:3003,fork,reuseaddr tcp-connect:send2ereader:8181
    depends_on:
      - send2ereader

networks:
  edge:
    external: true
